<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted – Hospital Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6 text-center">
            <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
                <div class="mb-4">
                    <span class="display-1 text-danger">
                        <i class="bi bi-shield-lock-fill"></i>
                    </span>
                </div>
                <h2 class="fw-bold text-dark mb-2">Access Restricted</h2>
                <h5 class="text-secondary fw-normal mb-3">HTTP 403 Forbidden</h5>
                <p class="text-muted mb-4">
                    Your current staff role does not have authorization to view or perform operations on this resource.
                    If you require access to this module, please contact the System Administrator.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary px-4 rounded-pill">
                        <i class="bi bi-house-door me-1"></i> Return to Dashboard
                    </a>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary px-4 rounded-pill">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign In as Another User
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
