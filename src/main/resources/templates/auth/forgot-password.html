<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Hospital Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d3b66 0%, #1e3d59 50%, #17b978 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .login-card {
            max-width: 460px;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            border: none;
        }
        .login-header {
            background: #0d3b66;
            color: #ffffff;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
        .login-header .brand-icon {
            font-size: 2.5rem;
            color: #17b978;
            margin-bottom: 0.5rem;
            display: inline-block;
        }
        .login-body {
            padding: 2rem;
        }
        .form-floating label {
            color: #6c757d;
        }
        .btn-reset {
            background: #0d3b66;
            border-color: #0d3b66;
            color: #ffffff;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }
        .btn-reset:hover {
            background: #17b978;
            border-color: #17b978;
            color: #ffffff;
            transform: translateY(-1px);
        }
        .security-badge {
            background-color: #e8f4fd;
            border-left: 4px solid #0d3b66;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <span class="brand-icon"><i class="bi bi-shield-lock"></i></span>
        <h4 class="fw-bold mb-1">Reset Password</h4>
        <p class="text-white-50 small mb-0">Hospital Management System Recovery</p>
    </div>

    <div class="login-body">
        <!-- Error Alert -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span th:text="${errorMessage}">Error message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="security-badge">
            <div class="small fw-bold text-dark"><i class="bi bi-patch-question me-1 text-primary"></i> Security Verification</div>
            <div class="small text-muted">Answer the security question to verify your identity and set a new password.</div>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <!-- Username -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" th:value="${username}" placeholder="Username" required autofocus>
                <label for="username"><i class="bi bi-person me-1"></i> Username (e.g. admin)</label>
            </div>

            <!-- Security Question: What is your language? -->
            <div class="mb-3">
                <label for="securityAnswer" class="form-label fw-semibold small text-dark mb-1">
                    <i class="bi bi-code-slash me-1 text-primary"></i> Question: What is your language?
                </label>
                <input type="text" class="form-control" id="securityAnswer" name="securityAnswer" placeholder="Enter answer (Hint: java)" required autocomplete="off">
            </div>

            <!-- New Password -->
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="New Password" required minlength="6">
                <label for="newPassword"><i class="bi bi-lock me-1"></i> New Password (min 6 chars)</label>
            </div>

            <!-- Confirm Password -->
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required minlength="6">
                <label for="confirmPassword"><i class="bi bi-lock-fill me-1"></i> Confirm New Password</label>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-reset rounded-pill">
                    <i class="bi bi-arrow-repeat me-1"></i> Reset Password
                </button>
            </div>

            <!-- Back to Login -->
            <div class="text-center">
                <a th:href="@{/login}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i> Back to Staff Sign In
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
