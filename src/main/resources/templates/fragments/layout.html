<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    layout.html – Reusable layout fragment
    Every page includes this via th:replace so that the sidebar
    and topbar remain consistent across the entire application.
-->
<body>

<!-- ==================== SIDEBAR ==================== -->
<nav th:fragment="sidebar" class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-hospital"></i>
        <span>HMS Admin</span>
    </div>
    <ul class="sidebar-nav">
        <li>
            <a th:href="@{/}">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a th:href="@{/patients}">
                <i class="bi bi-people"></i>
                <span>Patients</span>
            </a>
        </li>
        <li>
            <a th:href="@{/doctors}">
                <i class="bi bi-person-badge"></i>
                <span>Doctors</span>
            </a>
        </li>
        <li>
            <a th:href="@{/appointments}">
                <i class="bi bi-calendar-check"></i>
                <span>Appointments</span>
            </a>
        </li>
        <li>
            <a th:href="@{/beds}">
                <i class="bi bi-door-open"></i>
                <span>Beds &amp; Admissions</span>
            </a>
        </li>
        <li>
            <a th:href="@{/bills}">
                <i class="bi bi-receipt"></i>
                <span>Billing</span>
            </a>
        </li>
    </ul>
</nav>

<!-- ==================== TOPBAR ==================== -->
<header th:fragment="topbar" class="topbar">
    <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
            <i class="bi bi-list"></i>
        </button>
        <h1 th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">Dashboard</h1>
    </div>
    <div class="topbar-right">
        <span class="text-muted" style="font-size:.85rem;">
            <i class="bi bi-clock me-1"></i>
            <span id="liveClock"></span>
        </span>
    </div>
</header>

<!-- Tiny inline script for the live clock in the topbar -->
<script th:fragment="clock-script">
    (function updateClock() {
        var el = document.getElementById('liveClock');
        if (el) {
            var now = new Date();
            el.textContent = now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
        }
        setTimeout(updateClock, 30000);
    })();
</script>

</body>
</html>
