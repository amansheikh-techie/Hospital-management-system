# ============================================================
# Hospital Management System - Application Configuration
# ============================================================

spring.application.name=hospital_management

# ------------------------------------------------------------
# MySQL DataSource Configuration
# ------------------------------------------------------------
# Credentials are read from environment variables so that
# passwords are never committed to source control.
#   DB_USERNAME  (default: root)
#   DB_PASSWORD  (default: empty string)
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate Settings
# ------------------------------------------------------------
# update = Hibernate will auto-create / alter tables to match
#          your Java entity classes. Safe for development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Thymeleaf Settings
# ------------------------------------------------------------
# During development, disable template caching so changes
# appear immediately without restarting the server.
spring.thymeleaf.cache=false

# ------------------------------------------------------------
# Server Settings
# ------------------------------------------------------------
server.port=8080
