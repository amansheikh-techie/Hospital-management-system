# ============================================================
# Hospital Management System - Application Configuration
# ============================================================

spring.application.name=hospital_management

# ------------------------------------------------------------
# MySQL DataSource Configuration
# ------------------------------------------------------------
# Credentials and database URL are read from environment variables
# so that production credentials are never committed to source control.
#   DB_URL       (default: local MySQL on port 3306)
#   DB_USERNAME  (default: root)
#   DB_PASSWORD  (default: empty string)
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate Settings
# ------------------------------------------------------------
# update = Hibernate will auto-create / alter tables to match
#          your Java entity classes. Safe for development.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Thymeleaf Settings
# ------------------------------------------------------------
# During development, disable template caching so changes
# appear immediately without restarting the server.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ------------------------------------------------------------
# Server Settings
# ------------------------------------------------------------
# Render dynamically assigns the port via the PORT environment variable.
# Defaults to 8080 for local development.
server.port=${PORT:8080}
